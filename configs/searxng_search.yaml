# Unaudited, stackable live-search profile backed by a self-hosted
# SearXNG instance — the key-free, quota-free alternative to
# configs/brave_search.yaml. Same mechanism: the sandbox `theoria-search`
# command, invoked through Codex's ordinary shell function tool.
#
# Stack after an all-Codex provider profile, for example:
#   --config configs/ollama.yaml --config configs/searxng_search.yaml
#
# Run the instance next to Ollama with its JSON output enabled:
#   docker run -d --name searxng -p 8888:8080 \
#     -v ./searxng:/etc/searxng searxng/searxng
#   # ./searxng/settings.yml must contain:
#   #   use_default_settings: true
#   #   search: { formats: [html, json] }
#
# Keep the instance bound to localhost — it is unauthenticated. Theoria
# routes a loopback endpoint to host.docker.internal for the sandbox,
# exactly like the Ollama endpoint.
#
# Trade-off vs Brave, honestly: no key in the sandbox and no query
# quota (parallel judges search freely), and the retrieval stack is
# pinnable and inspectable — but SearXNG scrapes upstream engines, so
# result quality depends on those engines not blocking your IP
# (datacenter IPs are often captcha'd; residential IPs work well).
# Search instructions are derived centrally from this run-level declaration;
# per-role prompt suffixes cannot overwrite the safety policy.

_web_search:
  provider: searxng
  endpoint: http://localhost:8888

solver:
  search: false

interpreter:
  search: false

formalizer:
  search: false

citation:
  search: false

problem_given:
  search: false

computation:
  search: false

pedantry:
  search: false

convention_lift:
  search: false

initial_state:
  search: false
